name: Build KernelSU-Next A526B

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies & Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libssl-dev libelf-dev python3 zip clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Bersihkan SukiSU Lama & Pasang KernelSU-Next
        run: |
          rm -rf drivers/kernelsu KernelSU KernelSU-Next
          sed -i '/kernelsu/d' drivers/Kconfig drivers/Makefile
          HOST="github.com"
          git clone --depth=1 -b next "https://${HOST}/KernelSU-Next/KernelSU-Next.git" KernelSU-Next
          bash KernelSU-Next/kernel/setup.sh legacy

      - name: Konfigurasi Defconfig Otomatis
        run: |
          DEFCONFIG_PATH=$(find arch/arm64/configs -name "*a52xq*defconfig" | head -n 1)
          echo "Menggunakan defconfig: $DEFCONFIG_PATH"
          sed -i '/CONFIG_KSU/d' "$DEFCONFIG_PATH"
          echo "CONFIG_KSU=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_KSU_KPROBE_HOOKS=n" >> "$DEFCONFIG_PATH"
          echo "CONFIG_OVERLAY_FS=y" >> "$DEFCONFIG_PATH"
          echo "DEFCONFIG_NAME=$(basename "$DEFCONFIG_PATH")" >> $GITHUB_ENV

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out ARCH=arm64 $DEFCONFIG_NAME
          make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- Image.gz-dtb dtbo.img

      - name: Package dengan AnyKernel3
        run: |
          HOST="github.com"
          git clone --depth=1 "https://${HOST}/itsaschoolbus-stuff/AnyKernel3.git" AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/ || true
          cd AnyKernel3
          zip -r9 ../touchGrass-KSUNext-A526B.zip * -x .git README.md *placeholder

      - name: Upload Hasil Build
        uses: actions/upload-artifact@v4
        with:
          name: touchGrass-KSUNext-A526B
          path: touchGrass-KSUNext-A526B.zip
